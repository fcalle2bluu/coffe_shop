<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Café La Paz - Realizar Pedido</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/animations.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        sidebar: '#020617',
                        sidebarHover: '#0f172a',
                        topbar: '#ffffff',
                        mainBg: '#f8fafc',
                        accent: '#f97316',
                        glass: 'rgba(255, 255, 255, 0.8)'
                    },
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    boxShadow: {
                        'premium': '0 10px 40px -10px rgba(0,0,0,0.08)',
                    }
                }
            }
        }
    </script>

    <link rel="icon" href="favicon.png" type="image/png">
</head>
<body class="bg-mainBg font-sans flex min-h-screen text-slate-800">

    <div id="sidebarOverlay" class="fixed inset-0 bg-slate-900/40 z-40 hidden md:hidden backdrop-blur-sm" onclick="toggleSidebar()"></div>

    <aside id="sidebar" class="w-64 bg-sidebar text-slate-400 flex flex-col fixed inset-y-0 left-0 z-50 transform -translate-x-full md:sticky md:top-0 md:h-screen shrink-0 md:translate-x-0 transition-all duration-300 ease-in-out border-r border-slate-800">
        <div class="h-16 flex items-center px-6 gap-3 border-b border-slate-800/50">
            <div class="w-8 h-8 bg-accent rounded-lg flex items-center justify-center shadow-lg shadow-accent/20">
                <i class="fa-solid fa-mug-hot text-white"></i>
            </div>
            <span class="text-white font-bold text-xl tracking-tight italic">Café <span class="text-accent">La Paz</span></span>
            <button onclick="toggleSidebar()" class="md:hidden ml-auto text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <div class="p-4 border-b border-slate-800/30">
            <div class="flex items-center gap-3 mb-4">
                <div class="w-10 h-10 rounded-xl bg-slate-800 flex items-center justify-center text-white ring-2 ring-slate-700/50">
                    <span id="avatar-letra" class="font-black text-sm text-orange-500">U</span>
                </div>
                <div class="overflow-hidden">
                    <p id="nombre-usuario" class="text-slate-200 text-sm font-bold truncate tracking-tight">Cargando...</p>
                    <p id="rol-usuario" class="text-[9px] text-emerald-500 font-black uppercase tracking-[0.2em] opacity-80">ROL</p>
                </div>
            </div>
            <button onclick="cerrarSesión()" class="w-full flex items-center justify-center gap-2 py-2.5 text-[10px] font-black uppercase tracking-widest border border-slate-800 rounded-xl hover:bg-slate-900 hover:text-white transition-all text-slate-500">
                <i class="fa-solid fa-power-off text-[10px]"></i> Salir
            </button>
        </div>

        <nav class="flex-1 overflow-y-auto py-4 px-3 space-y-1">
            <a href="realizar_pedido.html" class="flex items-center gap-3 px-4 py-3 rounded-xl transition-all duration-200 bg-orange-500/10 text-orange-500 font-bold">
                <i class="fa-solid fa-utensils w-5 text-center text-orange-500/60"></i> <span>Realizar Pedido</span>
            </a>
            <a href="pedidos_internos.html" class="flex items-center gap-3 px-4 py-3 rounded-xl transition-all duration-200 hover:bg-slate-900 hover:text-slate-200 font-medium">
                <i class="fa-solid fa-clipboard-list w-5 text-center text-orange-500/60"></i> <span>Pedidos Internos</span>
            </a>
            <a href="asistencia.html" class="flex items-center gap-3 px-4 py-3 rounded-xl transition-all duration-200 hover:bg-slate-900 hover:text-slate-200 font-medium">
                <i class="fa-solid fa-user-clock w-5 text-center text-orange-500/60"></i> <span>Asistencia QR</span>
            </a>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col min-w-0 h-screen overflow-hidden">
        <header class="h-16 bg-white/70 backdrop-blur-md text-slate-900 border-b border-slate-200/60 flex items-center justify-between px-6 sticky top-0 z-30 shadow-premium">
            <button onclick="toggleSidebar()" class="focus:outline-none hover:bg-logoBg p-2 rounded transition-colors md:hidden"><i class="fa-solid fa-bars text-xl"></i></button>
            <h1 class="text-base sm:text-lg font-bold tracking-wide truncate ml-2 md:ml-0 flex-1">Realizar Pedido</h1>

            <div class="flex items-center gap-1 bg-slate-100 rounded-xl p-1">
                <button id="tab-btn-pedido" onclick="cambiarVista('pedido')" class="px-3 sm:px-4 py-1.5 rounded-lg text-xs font-black uppercase tracking-wider transition-all bg-white text-orange-500 shadow-sm">
                    <i class="fa-solid fa-cart-shopping mr-1"></i> Pedido
                </button>
                <button id="tab-btn-control" onclick="cambiarVista('control')" class="px-3 sm:px-4 py-1.5 rounded-lg text-xs font-black uppercase tracking-wider transition-all text-slate-500">
                    <i class="fa-solid fa-list-check mr-1"></i> Control
                </button>
            </div>
        </header>

        <!-- VISTA: REALIZAR PEDIDO -->
        <div id="vista-pedido" class="flex-1 flex flex-col md:flex-row overflow-hidden min-h-0">

            <div class="w-full md:w-2/3 p-2 sm:p-4 flex flex-col bg-mainBg overflow-hidden flex-1 md:flex-none h-1/2 md:h-full min-h-0">
                <div class="mb-3 sm:mb-4 relative shrink-0">
                    <input type="text" id="buscarProducto" autocomplete="off" placeholder="Buscar producto..." class="w-full pl-11 pr-4 py-2.5 sm:py-3 rounded-2xl border border-slate-200 focus:border-orange-500 focus:ring-2 focus:ring-orange-500/20 focus:outline-none text-slate-700 font-medium text-sm sm:text-base bg-white shadow-sm transition-all">
                    <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                </div>

                <div class="flex-1 overflow-y-auto pr-1 sm:pr-2 min-h-0">
                    <div id="grid-productos" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-2 sm:gap-4 pb-4"></div>
                </div>
            </div>

            <div class="w-full md:w-1/3 md:max-w-md bg-white shadow-[0_-10px_15px_-3px_rgba(0,0,0,0.1)] md:shadow-none md:border-l border-slate-200/80 border-t-2 md:border-t-0 flex flex-col z-10 h-[50vh] md:h-full shrink-0 min-h-0">
                <div class="px-4 py-3 bg-slate-950 text-white flex items-center justify-between shrink-0">
                    <div class="flex items-center gap-3">
                        <div class="w-9 h-9 rounded-xl bg-orange-500/15 border border-orange-500/20 flex items-center justify-center">
                            <i class="fa-solid fa-receipt text-orange-400"></i>
                        </div>
                        <div>
                            <h2 class="font-bold text-sm tracking-tight leading-none">Pedido actual</h2>
                            <p class="text-[10px] text-slate-400 font-semibold mt-1"><span id="ticket-count">0</span> artículos</p>
                        </div>
                    </div>
                    <button onclick="limpiarCarrito()" class="text-[10px] font-black uppercase tracking-widest text-slate-400 hover:text-rose-400 transition-colors flex items-center gap-1.5 btn-bounce">
                        <i class="fa-solid fa-trash-can"></i> Limpiar
                    </button>
                </div>

                <div class="px-4 py-3 bg-slate-50 border-b border-slate-200 shrink-0">
                    <label class="block text-[10px] font-black uppercase tracking-widest text-slate-400 mb-1.5">Mesa</label>
                    <select id="select-mesa" class="w-full border border-slate-200 text-slate-800 rounded-xl px-3 py-2.5 bg-white focus:ring-2 focus:ring-orange-500/50 focus:border-orange-500 outline-none font-bold text-sm transition-all cursor-pointer">
                        <option value="">Cargando mesas...</option>
                    </select>
                </div>

                <div class="flex-1 overflow-y-auto px-3 py-2.5 bg-slate-50/70 min-h-0" id="ticket-items">
                    <div class="h-full flex flex-col items-center justify-center text-center text-slate-400 py-8">
                        <div class="w-16 h-16 rounded-2xl bg-white border border-dashed border-slate-300 flex items-center justify-center mb-3">
                            <i class="fa-solid fa-basket-shopping text-2xl opacity-30"></i>
                        </div>
                        <p class="text-sm font-semibold">Pedido vacío</p>
                        <p class="text-xs text-slate-300 mt-1">Toca un producto para agregarlo</p>
                    </div>
                </div>

                <div class="bg-white border-t border-slate-200 p-3 sm:p-4 flex flex-col gap-2.5 shrink-0 shadow-[0_-8px_20px_-12px_rgba(0,0,0,0.18)]">
                    <div class="flex justify-between items-end">
                        <span class="text-[10px] font-black uppercase tracking-[0.2em] text-slate-400 mb-1.5">Total pedido</span>
                        <span class="text-2xl sm:text-3xl font-black text-slate-900 tracking-tight" id="total-ticket">Bs. 0.00</span>
                    </div>

                    <button onclick="generarComanda()" id="btn-generar" class="w-full bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 active:scale-[0.99] text-white font-black py-3.5 sm:py-4 rounded-2xl shadow-lg shadow-orange-500/30 text-base sm:text-lg tracking-wide transition-all disabled:from-slate-400 disabled:to-slate-500 disabled:opacity-70 disabled:cursor-not-allowed disabled:shadow-none btn-bounce">
                        <i class="fa-solid fa-bell-concierge mr-1"></i> GENERAR COMANDA
                    </button>
                </div>
            </div>
        </div>

        <!-- VISTA: CONTROL -->
        <div id="vista-control" class="hidden flex-1 overflow-y-auto p-4 sm:p-6">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-sm font-black uppercase tracking-widest text-slate-500 flex items-center gap-2">
                    <i class="fa-solid fa-list-check text-orange-500"></i> Mis comandas de hoy
                </h2>
                <button onclick="cargarMisComandas()" class="text-xs font-bold text-slate-500 hover:text-orange-500 transition-colors">
                    <i class="fa-solid fa-rotate mr-1"></i> Actualizar
                </button>
            </div>
            <div id="lista-control" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                <p class="text-slate-400 text-sm italic col-span-full">Cargando...</p>
            </div>
        </div>
    </main>

    <script src="js/realizar_pedido.js"></script>
    <script>
        if (!localStorage.getItem('usuario_id')) {
            window.location.href = 'index.html';
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('-translate-x-full');
            document.getElementById('sidebarOverlay').classList.toggle('hidden');
        }

        function cerrarSesión() {
            localStorage.clear();
            window.location.href = 'index.html';
        }

        window.addEventListener('DOMContentLoaded', () => {
            const nombreActual = localStorage.getItem('usuario_nombre');
            const rolActual = localStorage.getItem('usuario_rol');

            if (nombreActual) {
                document.getElementById('nombre-usuario').innerText = nombreActual;
                document.getElementById('avatar-letra').innerText = nombreActual.charAt(0).toUpperCase();
            }
            if (rolActual) {
                document.getElementById('rol-usuario').innerHTML = `<i class="fa-solid fa-circle text-[10px] mr-1"></i> ${rolActual}`;
            }
        });
    </script>
    <script src="js/security_guard.js"></script>
</body>
</html>
