name: coffe_shop_app
description: Sistema Móvil de Ventas y Gestión para Café La Paz.
version: 1.0.7+8

publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.5
  http: ^1.1.0
  shared_preferences: ^2.2.0
  google_fonts: ^6.1.0
  font_awesome_flutter: ^11.0.0
  intl: ^0.19.0
  image_picker: ^1.0.7
  firebase_core: ^2.27.0
  firebase_messaging: ^14.7.19
  fl_chart: ^0.66.0
  webview_flutter: ^4.8.0
  permission_handler: ^11.3.1
  geolocator: ^9.0.2
  url_launcher: ^6.3.2
  sunmi_printer_plus: ^4.1.1
  package_info_plus: ^8.0.0
  path_provider: ^2.1.3
  open_file: ^3.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png
    - assets/qr_scanner.html


